[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solenz-downloader"
version = "0.1.7"
description = "Bağımsız Python medya indirme motoru - TLS parmak izi taklidi ile - YouTube arama özelliği ve indirme hızı iyileştirmeleri eklendi!"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Solenz"}
]
keywords = ["youtube", "tiktok", "instagram", "downloader", "media", "video", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests>=2.31.0",
    "pysocks>=1.7.1",
    "yt-dlp",
]

[project.optional-dependencies]
tls = [
    "curl_cffi>=0.7.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["solenz_downloader*", "api_service*"]
